name: Flutter checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentspace-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
